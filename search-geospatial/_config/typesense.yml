ElliotSawyer\SilverstripeTypesense\Typesense:
  collections:
    ElliotSawyer\NZStreets\NZStreetAddress:
      name: Addresses
      fields:
        - { name: Region, type: string, facet: true, sort: false, optional: true }
        - { name: Council, type: string, facet: true, sort: false, optional: true }
        - { name: City, type: string, facet: true, sort: false, optional: true }
        - { name: Suburb, type: string, facet: true, sort: false, optional: true }
        - { name: FullAddress, type: string}
        - { name: Location, type: geopoint}
      import_limit: 100000
      connection_timeout: 60
      enable_nested_fields: true
ElliotSawyer\NZStreets\NZStreetAddress:
  extensions:
    - ElliotSawyer\TypesenseSearch\Geospatial\NZStreetExtension
