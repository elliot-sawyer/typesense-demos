version: "3"

services:
  webserver:
    build:
      context: ./bin/${PHPVERSION}
    ports:
      - "${HOST_MACHINE_SECURE_HOST_PORT}:443"
    links:
      - db
      - typesense
    volumes:
     - ${DOCUMENT_ROOT-./www}:/var/www/html:rw
    environment:
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html}
      PMA_PORT: ${HOST_MACHINE_PMA_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      HOST_MACHINE_MYSQL_PORT: ${HOST_MACHINE_MYSQL_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  db:
    image: mariadb:12
    restart: "always"
    ports:
      - "127.0.0.1:${HOST_MACHINE_MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_INITDB_DIR-./config/initdb}:/docker-entrypoint-initdb.d
      #- ${MYSQL_DATA_DIR-./data/mysql}:/var/lib/mysql
      #- ${MYSQL_LOG_DIR-./data/logs/mysql}:/var/log/mysql
      - /mnt/02D29E06D29DFDDB/Downloads/nz-addresses-CSV:/root
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  pma:
    image: phpmyadmin
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      MEMORY_LIMIT: ${MEMORY_LIMIT}
    ports:
      - "${HOST_MACHINE_PMA_PORT}:80"
      - "${HOST_MACHINE_PMA_SECURE_PORT}:443"
    volumes:
      - /sessions
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/conf.d/php-phpmyadmin.ini
  typesense:
    image: typesense/typesense:30.1
    ports:
#      - "8443:443"
      - "${HOST_MACHINE_TYPESENSE_PORT}:8108"
    volumes:
      - ./typesense-data:/data
#      '--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors --enable-search-analytics=true --analytics-flush-interval=60'
    command:
      - "--data-dir"
      - "/data"
      - "--api-key=${TYPESENSE_API_KEY}"
      - "--enable-cors"
      - "--enable-search-analytics=true"
      - "--analytics-flush-interval=60"
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
  typesense-dashboard:
    image: ghcr.io/bfritscher/typesense-dashboard:latest
    ports:
      - '${HOST_MACHINE_TYPESENSE_DASHBOARD_PORT}:80'
